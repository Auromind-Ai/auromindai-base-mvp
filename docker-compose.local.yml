services:

  redis:
    image: redis:7-alpine
    container_name: auromind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: pgvector/pgvector:pg16
    container_name: auromind_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Arunjack007%40}
      POSTGRES_DB: ${POSTGRES_DB:-auromindai}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auromindai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: auromind_backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade heads &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1 --timeout-keep-alive 75"
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:Arunjack007%40@db:5432/auromindai}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Arunjack007%40}
      POSTGRES_DB: ${POSTGRES_DB:-auromindai}
      SECRET_KEY: ${SECRET_KEY}
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: auromind_celery_worker
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: |
      sh -c "python -c \"import textwrap; exec(textwrap.dedent('''
      import time
      from app.database import engine
      for i in range(60):
          try:
              with engine.connect():
                  break
          except Exception as e:
              time.sleep(1)
      '''))\" && celery -A app.core.celery_app worker --loglevel=info --pool=prefork --concurrency=2 -Q default,beat,campaigns_queue,critical_queue"
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:Arunjack007%40@db:5432/auromindai}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Arunjack007%40}
      POSTGRES_DB: ${POSTGRES_DB:-auromindai}
      SECRET_KEY: ${SECRET_KEY}
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: auromind_celery_beat
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: |
      sh -c "python -c \"import textwrap; exec(textwrap.dedent('''
      import time
      from app.database import engine
      for i in range(60):
          try:
              with engine.connect():
                  break
          except Exception as e:
              time.sleep(1)
      '''))\" && celery -A app.core.celery_app beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:Arunjack007%40@db:5432/auromindai}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Arunjack007%40}
      POSTGRES_DB: ${POSTGRES_DB:-auromindai}
      SECRET_KEY: ${SECRET_KEY}
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
      - ./celerybeat_data:/var/lib/celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auromind_frontend
    restart: unless-stopped
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  celerybeat_data:
