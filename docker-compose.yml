
services:

  redis:
    image: redis:7-alpine
    container_name: auromind_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: pgvector/pgvector:pg16
    container_name: auromind_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yogeshdb}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-yogeshdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: auromind_backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade heads &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-keep-alive 75 --no-access-log --log-level error"
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-yogeshdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: 1
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy



  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: auromind_celery_worker
    env_file:
      - ./backend/.env
    restart: unless-stopped

    command: |
      sh -c "python -c \"import textwrap; exec(textwrap.dedent('''
      import time
      from app.database import engine
      for i in range(60):
          try:
              with engine.connect():
                  break
          except Exception as e:
              time.sleep(1)
      '''))\" && celery -A app.core.celery_app worker --loglevel=error --pool=prefork --concurrency=2 -Q default,beat,campaigns_queue,critical_queue"
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yogeshdb}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: 1
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: auromind_celery_beat
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: |
      sh -c "python -c \"import textwrap; exec(textwrap.dedent('''
      import time
      from app.database import engine
      for i in range(60):
          try:
              with engine.connect():
                  break
          except Exception as e:
              time.sleep(1)
      '''))\" && celery -A app.core.celery_app beat --loglevel=error"
    environment:
      PYTHONUNBUFFERED: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: 1
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data: