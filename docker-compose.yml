services:

  redis:
    image: redis:7-alpine
    container_name: auromind_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - orbionagents_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: auromind_backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade heads &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-keep-alive 75 --no-access-log --log-level error"
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-error}
      POSTGRES_HOST: 172.30.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: auromindai
      POSTGRES_DB: auromindai
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orbionagents_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: auromind_celery_worker
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: |
      sh -c "python -c \"import textwrap; exec(textwrap.dedent('''
      import time
      from app.database import engine
      for i in range(60):
          try:
              with engine.connect():
                  break
          except Exception as e:
              time.sleep(1)
      '''))\" && celery -A app.core.celery_app worker --loglevel=error --pool=prefork --concurrency=2 -Q default,beat,campaigns_queue,critical_queue"
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-error}
      POSTGRES_HOST: 172.30.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: auromindai
      POSTGRES_DB: auromindai
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orbionagents_network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: auromind_celery_beat
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: |
      sh -c "python -c \"import textwrap; exec(textwrap.dedent('''
      import time
      from app.database import engine
      for i in range(60):
          try:
              with engine.connect():
                  break
          except Exception as e:
              time.sleep(1)
      '''))\" && celery -A app.core.celery_app beat --loglevel=error --schedule=/var/lib/celery/celerybeat-schedule"
    environment:
      PYTHONUNBUFFERED: "1"
      POSTGRES_HOST: 172.30.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: auromindai
      POSTGRES_DB: auromindai
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
      - ./celerybeat_data:/var/lib/celery
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orbionagents_network

networks:
  orbionagents_network:
    external: true
    name: orbionagents_network
