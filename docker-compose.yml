
services:

  redis:
    image: redis:7-alpine
    container_name: auromind_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: pgvector/pgvector:pg16
    container_name: auromind_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Arunjack007@}
      POSTGRES_DB: ${POSTGRES_DB:-auromindai}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auromindai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: auromind_backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade heads &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-keep-alive 75"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: 1
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy



  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: auromind_celery_worker
    env_file:
      - ./backend/.env
    restart: unless-stopped

    command: |
      sh -c "python -c \"import textwrap; exec(textwrap.dedent('''
      import time
      from app.database import engine
      for i in range(60):
          try:
              with engine.connect():
                  print('Database connection successful!')
                  break
          except Exception as e:
              print(f'Waiting for database ({i}/60)...')
              time.sleep(1)
      else:
          print('Database connection timed out!')
      '''))\" && celery -A app.core.celery_app worker --loglevel=info --pool=prefork --concurrency=2 -Q default,beat"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: 1
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: app
    container_name: auromind_celery_beat
    env_file:
      - ./backend/.env
    restart: unless-stopped
    command: |
      sh -c "python -c \"import textwrap; exec(textwrap.dedent('''
      import time
      from app.database import engine
      for i in range(60):
          try:
              with engine.connect():
                  print('Database connection successful!')
                  break
          except Exception as e:
              print(f'Waiting for database ({i}/60)...')
              time.sleep(1)
      else:
          print('Database connection timed out!')
      '''))\" && celery -A app.core.celery_app beat --loglevel=info"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: 1
    volumes:
      - ./backend/logs:/app/logs
      - ./backend:/app
      - /app/temp_uploads
      - ./hf_cache:/models/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auromind_frontend
    restart: unless-stopped
    command: npm run dev
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: