name: Backend CI/CD Pipeline 🚀

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "docker-compose*.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # ==========================================
  # 1. CI: Continuous Integration & Verification
  # ==========================================
  ci-check:
    name: Backend Lint & Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Syntax & Compilation Check
        run: |
          python -m compileall backend/

  # ==========================================
  # 2. CD: Continuous Deployment via SSH
  # ==========================================
  cd-deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: ci-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Ubuntu VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting Deployment on $(hostname)..."
            cd /www/wwwroot/api.orbionagents.com

            echo "📥 Pulling latest changes from main branch..."
            git pull origin main

            echo "🔄 Restarting backend and worker containers..."
            docker compose restart backend celery_worker celery-beat

            echo "✅ Deployment completed successfully!"

  # ==========================================
  # 3. Notification: Email Alert on Success / Failure
  # ==========================================
  notify:
    name: Send Email Notification
    runs-on: ubuntu-latest
    needs: [ci-check, cd-deploy]
    if: always()
    steps:
      - name: Send Notification Email
        if: ${{ secrets.SMTP_USER != '' }}
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD || secrets.SMTP_PASS }}
          subject: >-
            ${{ (needs.ci-check.result == 'success' && needs.cd-deploy.result == 'success') && '✅ [SUCCESS] Backend Deployment Succeeded' || '❌ [FAILED] Backend Deployment Error' }} - ${{ github.repository }}
          to: ${{ secrets.NOTIFICATION_EMAIL || secrets.SMTP_USER }}
          from: "Orbion CI/CD <${{ secrets.SMTP_USER }}>"
          html_body: |
            <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;">
              <div style="background-color: ${{ (needs.ci-check.result == 'success' && needs.cd-deploy.result == 'success') && '#10B981' || '#EF4444' }}; color: white; padding: 20px; text-align: center;">
                <h2 style="margin: 0;">${{ (needs.ci-check.result == 'success' && needs.cd-deploy.result == 'success') && '🎉 Deployment Successful!' || '⚠️ Deployment Failed!' }}</h2>
              </div>
              <div style="padding: 24px; color: #374151; line-height: 1.6;">
                <p><strong>Repository:</strong> ${{ github.repository }}</p>
                <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
                <p><strong>Commit:</strong> <code>${{ github.sha }}</code></p>
                <p><strong>Author:</strong> ${{ github.actor }}</p>
                <p><strong>Commit Message:</strong> ${{ github.event.head_commit.message }}</p>
                <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 20px 0;" />
                <h3 style="margin-top: 0; color: #111827;">Pipeline Status Summary:</h3>
                <ul>
                  <li><strong>CI Check (Syntax & Dependencies):</strong> ${{ needs.ci-check.result == 'success' && '✅ PASSED' || (needs.ci-check.result == 'failure' && '❌ FAILED' || needs.ci-check.result) }}</li>
                  <li><strong>CD Deploy (Server SSH & Restart):</strong> ${{ needs.cd-deploy.result == 'success' && '✅ PASSED' || (needs.cd-deploy.result == 'failure' && '❌ FAILED' || needs.cd-deploy.result) }}</li>
                </ul>
                <div style="background-color: #f3f4f6; padding: 12px; border-radius: 6px; font-size: 14px; margin: 15px 0;">
                  <strong>Reason / Details:</strong><br/>
                  ${{ (needs.ci-check.result == 'success' && needs.cd-deploy.result == 'success') && 'All checks passed. The latest code was pulled and backend, celery_worker, and celery-beat containers were successfully restarted on the server.' || (needs.ci-check.result == 'failure' && 'The CI verification failed due to syntax error or dependency compilation issues. Deployment was prevented for safety.' || 'The server deployment failed during SSH connection, git pull, or docker container restart. Click below to view the exact error line.') }}
                </div>
                <div style="text-align: center; margin-top: 25px;">
                  <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="background-color: #2563eb; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block;">
                    View Detailed Execution Logs
                  </a>
                </div>
              </div>
            </div>
